name: CI/CD
on:
  push:
    branches:
      - main
      - beta
      - renovate/**
  pull_request: null
permissions:
  contents: write
  issues: write
  pull-requests: write
jobs:
  lint-commit-messages:
    uses: vidavidorra/.github/.github/workflows/lint-commit-messages.yml@5bcb0b10b5a4fb39a0fbe48fcadad13798a7e1dd # v8.1.31
  lint:
    uses: vidavidorra/.github/.github/workflows/node-lint.yml@5bcb0b10b5a4fb39a0fbe48fcadad13798a7e1dd # v8.1.31
  build:
    uses: vidavidorra/.github/.github/workflows/node-build.yml@5bcb0b10b5a4fb39a0fbe48fcadad13798a7e1dd # v8.1.31
  release:
    uses: vidavidorra/.github/.github/workflows/release.yml@5bcb0b10b5a4fb39a0fbe48fcadad13798a7e1dd # v8.1.31
    needs:
      - lint-commit-messages
      - lint
      - build
    secrets:
      privateKey: ${{ secrets.RELEASE_PRIVATE_KEY }}
