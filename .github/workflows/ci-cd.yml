name: CI/CD
on:
  push:
    branches:
      - main
      - beta
      - renovate/**
  pull_request: null
permissions:
  contents: write
  issues: write
  pull-requests: write
jobs:
  lint-commit-messages:
    uses: vidavidorra/.github/.github/workflows/lint-commit-messages.yml@30dc9a01ce7cf041e9cea59c965d5cf25efca2f0 # v8.1.30
  lint:
    uses: vidavidorra/.github/.github/workflows/node-lint.yml@30dc9a01ce7cf041e9cea59c965d5cf25efca2f0 # v8.1.30
  build:
    uses: vidavidorra/.github/.github/workflows/node-build.yml@30dc9a01ce7cf041e9cea59c965d5cf25efca2f0 # v8.1.30
  release:
    uses: vidavidorra/.github/.github/workflows/release.yml@30dc9a01ce7cf041e9cea59c965d5cf25efca2f0 # v8.1.30
    needs:
      - lint-commit-messages
      - lint
      - build
    secrets:
      privateKey: ${{ secrets.RELEASE_PRIVATE_KEY }}
