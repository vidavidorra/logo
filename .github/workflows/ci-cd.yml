name: CI/CD
on:
  push:
    branches:
      - main
      - beta
      - renovate/**
  pull_request: null
permissions:
  contents: write
  issues: write
  pull-requests: write
jobs:
  lint-commit-messages:
    uses: vidavidorra/.github/.github/workflows/lint-commit-messages.yml@78302caef4e9d0f350a0f82a2b403b401570e713 # v8.1.29
  lint:
    uses: vidavidorra/.github/.github/workflows/node-lint.yml@78302caef4e9d0f350a0f82a2b403b401570e713 # v8.1.29
  build:
    uses: vidavidorra/.github/.github/workflows/node-build.yml@78302caef4e9d0f350a0f82a2b403b401570e713 # v8.1.29
  release:
    uses: vidavidorra/.github/.github/workflows/release.yml@78302caef4e9d0f350a0f82a2b403b401570e713 # v8.1.29
    needs:
      - lint-commit-messages
      - lint
      - build
    secrets:
      privateKey: ${{ secrets.RELEASE_PRIVATE_KEY }}
